<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nerofit — Admin</title>
<style>
  :root { --bg:#000; --card:#141414; --line:#262626; --hi:#fff; --lo:#8a8a8a; --acc:#D4E924; --ok:#D4E924; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--hi); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:640px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:var(--lo); font-weight:700; }
  h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--lo); margin:22px 0 8px; }
  input, select, button { font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--hi); padding:11px 13px; width:100%; }
  button { background:var(--acc); color:#000; border:none; font-weight:700; letter-spacing:.03em; cursor:pointer; }
  button.ghost { background:transparent; color:var(--hi); border:1px solid var(--line); }
  button.mini { width:auto; padding:7px 11px; font-size:13px; }
  button.danger { background:var(--bad); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:10px; border:1px solid var(--line); }
  .between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
  .badge.ok { background:var(--ok); color:#000; } .badge.bad { background:var(--bad); color:#000; }
  .muted { color:var(--lo); font-size:13px; }
  .big { font-size:22px; font-weight:800; margin:4px 0; }
  .nav { display:flex; gap:8px; margin-top:14px; }
  .nav button { flex:1; }
  .nav button.on { background:var(--acc); color:#000; } .nav button.off { background:transparent; color:var(--hi); border:1px solid var(--line); }
  .hidden { display:none; }
  .item { padding:9px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  .clickable { cursor:pointer; }
  label { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lo); display:block; margin:12px 0 5px; }
</style>
</head>
<body>
  <h1>Nerofit · Admin</h1>

  <!-- Login -->
  <div id="login">
    <label>Admin parol</label>
    <div class="row">
      <input id="pwd" type="password" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button style="flex:0 0 110px" onclick="login()">Kirish</button>
    </div>
    <p id="loginMsg" class="muted"></p>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <div class="nav">
      <button id="tab-staff" class="on" onclick="show('staff')">Xodimlar</button>
      <button id="tab-members" class="off" onclick="show('members')">A'zolar</button>
      <button id="tab-feed" class="off" onclick="show('feed')">Faoliyat</button>
    </div>

    <!-- Staff -->
    <section id="sec-staff">
      <h2>Yangi xodim</h2>
      <div class="card">
        <label>Ism</label>
        <input id="ns-name" placeholder="Xodim ismi" autocomplete="off" />
        <label>Parol (noyob)</label>
        <input id="ns-pwd" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button style="margin-top:10px" onclick="addStaff()">Qo'shish</button>
        <p id="ns-msg" class="muted"></p>
      </div>
      <h2>Xodimlar ro'yxati</h2>
      <div id="staffList"></div>
    </section>

    <!-- Members -->
    <section id="sec-members" class="hidden">
      <h2>A'zoni qidirish (ism bo'yicha)</h2>
      <div class="row">
        <input id="mq" placeholder="Ism..." autocomplete="off" onkeydown="if(event.key==='Enter')searchMembers()" />
        <button style="flex:0 0 110px" onclick="searchMembers()">Qidirish</button>
      </div>
      <div id="memberResults"></div>
      <div id="memberDetail"></div>
    </section>

    <!-- Feed -->
    <section id="sec-feed" class="hidden">
      <div class="between" style="margin-top:14px">
        <h2 style="margin:0">So'nggi kelishlar</h2>
        <button class="ghost mini" onclick="loadFeed()">Yangilash</button>
      </div>
      <div id="feed"></div>
    </section>

    <button class="ghost" style="margin-top:26px" onclick="logout()">Chiqish</button>
  </div>

<script>
  const API = "https://orhhiqdvukshlvtqorgp.functions.supabase.co/admin-verify";
  let PWD = "";
  let staffCache = [];
  const $ = (id) => document.getElementById(id);

  async function api(action, extra) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(Object.assign({ action, password: PWD }, extra || {})),
    });
    let data = {}; try { data = await res.json(); } catch (e) {}
    return { status: res.status, data };
  }

  function fmt(dt) {
    if (!dt) return "-";
    const d = new Date(dt);
    if (isNaN(d)) return dt;
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function uzs(n) { return (n || 0).toLocaleString("ru-RU"); }

  // ── Auth ──────────────────────────────────────────────────────────────
  async function login() {
    PWD = $("pwd").value;
    $("loginMsg").textContent = "Tekshirilmoqda…";
    const r = await api("session");
    if (r.status !== 200) { $("loginMsg").textContent = "Parol noto'g'ri"; return; }
    if (r.data.role !== "admin") { $("loginMsg").textContent = "Bu parol admin emas (xodim). Admin parol kerak."; return; }
    try { localStorage.setItem("na_pwd", PWD); } catch (e) {}
    $("loginMsg").textContent = "";
    $("login").classList.add("hidden");
    $("dash").classList.remove("hidden");
    loadStaff(); loadFeed();
  }
  function logout() {
    PWD = ""; try { localStorage.removeItem("na_pwd"); } catch (e) {}
    $("dash").classList.add("hidden"); $("login").classList.remove("hidden"); $("pwd").value = "";
  }
  function show(tab) {
    ["staff", "members", "feed"].forEach((t) => {
      $("sec-" + t).classList.toggle("hidden", t !== tab);
      $("tab-" + t).className = t === tab ? "on" : "off";
    });
    if (tab === "feed") loadFeed();
  }

  // ── Staff management ────────────────────────────────────────────────────
  async function loadStaff() {
    const r = await api("staff_list");
    staffCache = (r.data && r.data.staff) || [];
    const box = $("staffList"); box.innerHTML = "";
    if (staffCache.length === 0) { box.innerHTML = '<p class="muted">Hali xodim yo’q.</p>'; return; }
    staffCache.forEach((s) => {
      const c = document.createElement("div"); c.className = "card";
      const top = document.createElement("div"); top.className = "between";
      const left = document.createElement("div");
      left.innerHTML = '<div style="font-weight:700">' + escapeHtml(s.name) + ' <span class="muted">· ' + s.role + '</span></div>' +
        '<div class="muted">' + (s.is_active ? "faol" : "o‘chirilgan") + '</div>';
      const badge = document.createElement("span");
      badge.className = "badge " + (s.is_active ? "ok" : "bad"); badge.textContent = s.is_active ? "ON" : "OFF";
      top.appendChild(left); top.appendChild(badge); c.appendChild(top);
      const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "10px";
      row.appendChild(btn("Parol", "ghost mini", () => setStaffPw(s)));
      row.appendChild(btn(s.is_active ? "O'chirish" : "Yoqish", "ghost mini", () => toggleStaff(s)));
      row.appendChild(btn("Del", "danger mini", () => delStaff(s)));
      c.appendChild(row);
      box.appendChild(c);
    });
  }
  async function addStaff() {
    const name = $("ns-name").value.trim(), pw = $("ns-pwd").value.trim();
    if (!name || !pw) { $("ns-msg").textContent = "Ism va parol kerak"; return; }
    const r = await api("staff_add", { name, password: pw });
    if (r.data && r.data.ok) { $("ns-name").value = ""; $("ns-pwd").value = ""; $("ns-msg").textContent = "Qo‘shildi ✓"; loadStaff(); }
    else { $("ns-msg").textContent = (r.data && r.data.error) || "Xato"; }
  }
  async function setStaffPw(s) {
    const pw = prompt("'" + s.name + "' uchun yangi parol:");
    if (!pw) return;
    const r = await api("staff_set_password", { staff_id: s.id, password: pw.trim() });
    alert(r.data && r.data.ok ? "Parol o‘zgartirildi" : ((r.data && r.data.error) || "Xato"));
  }
  async function toggleStaff(s) {
    await api("staff_set_active", { staff_id: s.id, is_active: !s.is_active }); loadStaff();
  }
  async function delStaff(s) {
    if (!confirm("'" + s.name + "' o‘chirilsinmi?")) return;
    await api("staff_delete", { staff_id: s.id }); loadStaff();
  }

  // ── Members ─────────────────────────────────────────────────────────────
  async function searchMembers() {
    $("memberDetail").innerHTML = "";
    const q = $("mq").value.trim(); if (!q) return;
    const box = $("memberResults"); box.innerHTML = '<p class="muted">Qidirilmoqda…</p>';
    const r = await api("members_search", { q });
    const list = (r.data && r.data.members) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Topilmadi.</p>'; return; }
    const c = document.createElement("div"); c.className = "card";
    list.forEach((m) => {
      const it = document.createElement("div"); it.className = "item clickable";
      it.textContent = m.name || "(ismsiz) " + m.id.slice(0, 8);
      it.onclick = () => openMember(m.id);
      c.appendChild(it);
    });
    box.appendChild(c);
  }
  async function openMember(userId) {
    const box = $("memberDetail"); box.innerHTML = '<p class="muted">Yuklanmoqda…</p>';
    const r = await api("member_detail", { user_id: userId });
    const d = r.data;
    if (!d || !d.found) { box.innerHTML = '<p class="muted">Ma’lumot yo’q.</p>'; return; }
    let html = '<div class="card">';
    html += '<span class="badge ' + (d.active ? "ok" : "bad") + '">' + (d.active ? "FAOL" : "FAOL EMAS") + '</span>';
    html += '<div class="big">' + escapeHtml(d.name || "(ismsiz)") + '</div>';
    if (d.membership) html += '<div class="muted">' + escapeHtml(d.membership.plan_name || "") + ' · tugaydi: ' + (d.membership.end_date || "-") + '</div>';
    html += '<h2>To‘lovlar (qachon qabul bo‘ldi)</h2>';
    html += (d.payments && d.payments.length) ? d.payments.map((p) =>
      '<div class="item"><div class="between"><span>' + uzs(p.amount_uzs) + ' so‘m · ' + p.provider + '</span><span class="muted">' + p.status + '</span></div>' +
      '<div class="muted">' + fmt(p.paid_at || p.created_at) + (p.staff_name ? ' · ' + escapeHtml(p.staff_name) : '') + '</div></div>'
    ).join("") : '<p class="muted">Yo’q</p>';
    html += '<h2>Kelishlar (qachon keldi)</h2>';
    html += (d.checkins && d.checkins.length) ? d.checkins.map((c) =>
      '<div class="item"><div class="between"><span>' + fmt(c.checked_at) + '</span><span class="badge ' + (c.was_active ? "ok" : "bad") + '">' + (c.was_active ? "faol" : "emas") + '</span></div>' +
      '<div class="muted">' + escapeHtml(c.staff_name || "-") + '</div></div>'
    ).join("") : '<p class="muted">Hali kelmagan</p>';
    html += '</div>';
    box.innerHTML = html;
  }

  // ── Feed ────────────────────────────────────────────────────────────────
  async function loadFeed() {
    const box = $("feed"); box.innerHTML = '<p class="muted">Yuklanmoqda…</p>';
    const r = await api("checkins_recent");
    const list = (r.data && r.data.checkins) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Hali kelishlar yo’q.</p>'; return; }
    const c = document.createElement("div"); c.className = "card";
    list.forEach((k) => {
      const it = document.createElement("div"); it.className = "item";
      it.innerHTML = '<div class="between"><span>' + escapeHtml(k.member_name || "(ismsiz)") + '</span>' +
        '<span class="badge ' + (k.was_active ? "ok" : "bad") + '">' + (k.was_active ? "faol" : "emas") + '</span></div>' +
        '<div class="muted">' + fmt(k.checked_at) + ' · ' + escapeHtml(k.staff_name || "-") + '</div>';
      c.appendChild(it);
    });
    box.appendChild(c);
  }

  function btn(text, cls, on) { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = on; return b; }
  function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

  // Auto-login if a password is remembered on this device.
  (function () {
    let saved = ""; try { saved = localStorage.getItem("na_pwd") || ""; } catch (e) {}
    if (saved) { $("pwd").value = saved; login(); }
  })();
</script>
</body>
</html>
