<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nerofit — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#000; --card:#141414; --line:#1f1f1f; --hi:#fff; --lo:#8a8a8a; --acc:#D4E924; --ok:#D4E924; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--hi); font-family:"Inter",-apple-system,Segoe UI,Roboto,sans-serif; }
  #login { max-width:400px; margin:0 auto; padding:56px 20px; }
  #login .app-brand { font-family:"Hanken Grotesk",sans-serif; font-size:24px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:22px; }
  #login .app-brand span { color:var(--acc); }
  h1 { font-family:"Hanken Grotesk",sans-serif; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--lo); font-weight:800; }
  h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--lo); margin:22px 0 8px; }
  input, select, textarea, button { font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--hi); padding:11px 13px; width:100%; font-family:inherit; }
  textarea { resize:vertical; }
  button { background:var(--acc); color:#000; border:none; font-weight:700; letter-spacing:.03em; cursor:pointer; }
  button.ghost { background:transparent; color:var(--hi); border:1px solid var(--line); }
  button.mini { width:auto; padding:7px 11px; font-size:13px; }
  button.danger { background:var(--bad); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:10px; border:1px solid var(--line); }
  .between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .badge.ok { background:var(--ok); color:#000; } .badge.bad { background:var(--bad); color:#000; }
  .badge.warn { background:#333; color:#fff; }
  .badge.soon { background:#2a2a12; color:var(--acc); } .badge.info { background:#2a2a2a; color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { width:auto; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--lo); font-size:12px; font-weight:700; letter-spacing:.04em; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--acc); color:#000; border-color:var(--acc); }
  .muted { color:var(--lo); font-size:13px; }
  .big { font-family:"Hanken Grotesk",sans-serif; font-size:22px; font-weight:800; margin:4px 0; }
  input[type=date] { color-scheme:dark; }
  /* Sidebar layout (Gymove-style left nav) */
  #dash { display:flex; align-items:flex-start; min-height:100vh; }
  #dash.hidden { display:none; } /* id+class beats the id-only display:flex above */
  .sidebar { flex:0 0 216px; align-self:stretch; background:#0d0d0d; border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .sidebar .brand { font-family:"Hanken Grotesk",sans-serif; font-size:17px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--hi); padding:4px 10px 20px; }
  .sidebar .brand span { color:var(--acc); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:11px; width:100%; justify-content:flex-start; text-align:left; padding:10px 12px; font-size:14px; font-weight:600; letter-spacing:0; border:none; border-radius:10px; background:transparent; color:var(--lo); }
  .nav button svg { width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; }
  .nav button.off:hover { background:var(--card); color:var(--hi); }
  .nav button.on { background:#1b1b0c; color:var(--acc); }
  .main { flex:1; min-width:0; padding:22px 28px 60px; }
  @media (max-width:760px) {
    #dash { flex-direction:column; }
    .sidebar { flex:none; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line); padding:10px; }
    .sidebar .brand { display:none; }
    .nav { flex-direction:row; overflow-x:auto; scrollbar-width:none; gap:4px; }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { flex:0 0 auto; width:auto; }
    .main { padding:16px; }
  }
  .hidden { display:none; }
  .item { padding:9px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  .detail { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  label { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lo); display:block; margin:12px 0 5px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
  .kpi .n { font-family:"Hanken Grotesk",sans-serif; font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .kpi .n.acc { color:var(--acc); }
  .kpi .l { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--lo); margin-top:3px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:110px; margin-top:4px; }
  .bars .bar { flex:1; background:var(--acc); border-radius:3px 3px 0 0; min-height:2px; }
  .bars .bar.dim { background:var(--line); }
  .bars .bar.hi { background:#fff; }
  .barlabels { display:flex; justify-content:space-between; font-size:9px; color:var(--lo); margin-top:5px; }
  button, .chip { transition:background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, transform .06s ease; }
  button:active:not(:disabled), .chip:active { transform:scale(.97); } /* tactile press feedback */
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button:disabled { opacity:.5; cursor:default; }
  /* Skeleton loaders (D1): shimmer blocks in the final layout's shape, not a spinner */
  .skel { background:linear-gradient(90deg,#161616 25%,#20200f 37%,#161616 63%); background-size:400% 100%; border-radius:8px; animation:shimmer 1.4s ease infinite; }
  .skel-row { height:13px; margin:11px 0; }
  @keyframes shimmer { from { background-position:100% 0; } to { background-position:-100% 0; } }
  /* Toasts (D1): replace alert() with non-blocking notifications */
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw; }
  .toast { background:var(--card); color:var(--hi); border:1px solid var(--line); border-radius:12px; padding:11px 16px; font-size:14px; font-weight:600; box-shadow:0 8px 28px rgba(0,0,0,.55); animation:toastIn .18s ease; }
  .toast.ok { border-color:var(--acc); } .toast.err { border-color:var(--bad); }
  @keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
  <div id="toast"></div>

  <!-- Login -->
  <div id="login">
    <div class="app-brand">Nero<span>fit</span></div>
    <label>Admin parol</label>
    <div class="row">
      <input id="pwd" type="password" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button style="flex:0 0 110px" onclick="login()">Kirish</button>
    </div>
    <p id="loginMsg" class="muted"></p>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <aside class="sidebar">
      <div class="brand">Nero<span>fit</span></div>
      <nav class="nav">
        <button id="tab-dash" class="on" onclick="show('dash')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
        <button id="tab-members" class="off" onclick="show('members')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>A'zolar</span></button>
        <button id="tab-trainers" class="off" onclick="show('trainers')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg><span>Trenerlar</span></button>
        <button id="tab-content" class="off" onclick="show('content')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span>Kontent</span></button>
        <button id="tab-finance" class="off" onclick="show('finance')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Moliya</span></button>
        <button id="tab-plans" class="off" onclick="show('plans')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span>Tariflar</span></button>
        <button id="tab-staff" class="off" onclick="show('staff')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg><span>Xodimlar</span></button>
        <button id="tab-audit" class="off" onclick="show('audit')"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg><span>Audit</span></button>
      </nav>
    </aside>
    <main class="main">

    <!-- Dashboard -->
    <section id="sec-dash">
      <div class="between"><h2 style="margin:14px 0 0">Bugungi holat</h2><button class="ghost mini" onclick="loadDash()">Yangilash</button></div>
      <div id="kpis" class="kpis"></div>
      <h2>Daromad · 14 kun</h2>
      <div class="card"><div id="revChart"></div></div>
      <h2>Kelishlar · soat bo'yicha (14 kun)</h2>
      <div class="card"><div id="hourChart"></div></div>
    </section>

    <!-- Staff -->
    <section id="sec-staff" class="hidden">
      <h2>Yangi xodim</h2>
      <div class="card">
        <label>Ism</label>
        <input id="ns-name" placeholder="Xodim ismi" autocomplete="off" />
        <label>Parol (noyob)</label>
        <input id="ns-pwd" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button style="margin-top:10px" onclick="addStaff()">Qo'shish</button>
        <p id="ns-msg" class="muted"></p>
      </div>

      <h2>Xodimlar ro'yxati</h2>
      <div id="staffList"></div>

      <h2>Admin paroli (o'zingizniki)</h2>
      <div class="card">
        <label>Hozirgi parol</label>
        <input id="ap-cur" type="password" placeholder="hozirgi" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <label>Yangi parol</label>
        <input id="ap-new" type="password" placeholder="yangi" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button style="margin-top:10px" onclick="changeAdminPw()">Saqlash</button>
        <p id="ap-msg" class="muted"></p>
      </div>

      <button class="ghost" style="margin-top:24px" onclick="logout()">Chiqish</button>
    </section>

    <!-- Members list (paginated + filtered) + activity -->
    <section id="sec-members" class="hidden">
      <div class="between"><h2 style="margin:14px 0 0">A'zolar</h2><button class="ghost mini" onclick="exportMembersCsv()">Eksport ⤓</button></div>

      <div id="mFilters" class="chips"></div>

      <div class="row" style="margin-top:10px">
        <input id="mq" placeholder="Ism yoki ID..." autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')applyMemberFilter()" />
        <button style="flex:0 0 96px" onclick="applyMemberFilter()">Qidirish</button>
      </div>
      <div class="row">
        <select id="mPlan" onchange="applyMemberFilter()"><option value="">Barcha tarif</option></select>
        <select id="mSort" onchange="applyMemberFilter()">
          <option value="asc">Tugash: yaqin → uzoq</option>
          <option value="desc">Tugash: uzoq → yaqin</option>
        </select>
      </div>

      <p id="mCount" class="muted" style="margin-top:12px"></p>
      <div id="membersList"></div>
      <button id="mMore" class="ghost hidden" style="margin-top:12px" onclick="loadMembers(true)">Ko'proq yuklash</button>

      <div class="between" style="margin-top:24px">
        <h2 style="margin:0">So'nggi kelishlar</h2>
        <button class="ghost mini" onclick="loadFeed()">Yangilash</button>
      </div>
      <div id="feed"></div>
    </section>

    <!-- Finance (journal · cash · revenue) -->
    <section id="sec-finance" class="hidden">
      <div class="nav" style="margin-top:14px">
        <button id="ftab-journal" class="on" onclick="showFinance('journal')">Jurnal</button>
        <button id="ftab-cash" class="off" onclick="showFinance('cash')">Kassa</button>
        <button id="ftab-revenue" class="off" onclick="showFinance('revenue')">Daromad</button>
      </div>

      <!-- Payments journal -->
      <div id="fsec-journal">
        <div id="fProvFilters" class="chips"></div>
        <div id="fStatFilters" class="chips"></div>
        <div class="row" style="margin-top:6px">
          <div><label>Dan</label><input id="fFrom" type="date" onchange="applyPayFilter()" /></div>
          <div><label>Gacha</label><input id="fTo" type="date" onchange="applyPayFilter()" /></div>
        </div>
        <div class="row">
          <input id="fq" placeholder="A'zo ismi..." autocomplete="off" onkeydown="if(event.key==='Enter')applyPayFilter()" />
          <button style="flex:0 0 96px" onclick="applyPayFilter()">Filtr</button>
        </div>
        <p id="fSum" class="muted" style="margin-top:12px"></p>
        <div id="paymentsList"></div>
        <button id="fMore" class="ghost hidden" style="margin-top:12px" onclick="loadPayments(true)">Ko'proq yuklash</button>
      </div>

      <!-- Daily cash -->
      <div id="fsec-cash" class="hidden">
        <label>Sana</label>
        <div class="row">
          <input id="cashDate" type="date" />
          <button style="flex:0 0 110px" onclick="loadCash()">Ko'rish</button>
        </div>
        <div id="cashReport"></div>
      </div>

      <!-- Revenue report -->
      <div id="fsec-revenue" class="hidden">
        <div class="row">
          <div><label>Dan</label><input id="revFrom" type="date" /></div>
          <div><label>Gacha</label><input id="revTo" type="date" /></div>
        </div>
        <button style="margin-top:10px" onclick="loadRevenue()">Hisoblash</button>
        <div id="revReport"></div>
      </div>
    </section>

    <!-- Plans (tariffs) -->
    <section id="sec-plans" class="hidden">
      <h2>Yangi tarif</h2>
      <div class="card">
        <label>Nom</label>
        <input id="np-name" placeholder="masalan: 1 oylik" autocomplete="off" />
        <label>Davomiylik (kun)</label>
        <input id="np-days" type="number" inputmode="numeric" placeholder="30" />
        <label>App narxi (so'm)</label>
        <input id="np-app" type="number" inputmode="numeric" placeholder="250000" />
        <label>Zal narxi (so'm)</label>
        <input id="np-gym" type="number" inputmode="numeric" placeholder="350000" />
        <label>Tartib (kichik = yuqorida)</label>
        <input id="np-sort" type="number" inputmode="numeric" placeholder="1" />
        <button style="margin-top:10px" onclick="addPlan()">Qo'shish</button>
        <p id="np-msg" class="muted"></p>
      </div>

      <h2>Tariflar ro'yxati</h2>
      <div id="plansList"></div>
    </section>

    <!-- Content: exercise library + videos -->
    <section id="sec-content" class="hidden">
      <h2>Yangi mashq</h2>
      <div class="card">
        <label>Nom</label>
        <input id="ne-title" placeholder="masalan: Squat" autocomplete="off" />
        <label>Mushaklar (vergul bilan)</label>
        <input id="ne-muscles" placeholder="oyoq, dumba" autocomplete="off" />
        <div class="row">
          <div><label>Set</label><input id="ne-sets" type="number" inputmode="numeric" placeholder="3" /></div>
          <div><label>Takror</label><input id="ne-reps" type="number" inputmode="numeric" placeholder="10" /></div>
        </div>
        <label>Rasm havolasi (ixtiyoriy)</label>
        <input id="ne-img" placeholder="https://..." autocomplete="off" />
        <button style="margin-top:10px" onclick="addExercise()">Qo'shish</button>
        <p id="ne-msg" class="muted"></p>
      </div>

      <div class="between" style="margin-top:8px"><h2 style="margin:0">Mashqlar</h2><button class="ghost mini" onclick="loadContent()">Yangilash</button></div>
      <div id="exerciseList"></div>
    </section>

    <!-- Trainers -->
    <section id="sec-trainers" class="hidden">
      <h2>Yangi trener</h2>
      <div class="card">
        <label>Ism</label>
        <input id="nt-name" placeholder="Trener ismi" autocomplete="off" />
        <label>Mutaxassislik (ixtiyoriy)</label>
        <input id="nt-spec" placeholder="masalan: Bodybuilding" autocomplete="off" />
        <label>Bio (ixtiyoriy)</label>
        <textarea id="nt-bio" rows="2" placeholder="Qisqacha"></textarea>
        <label>Rasm havolasi (ixtiyoriy)</label>
        <input id="nt-photo" placeholder="https://..." autocomplete="off" />
        <button style="margin-top:10px" onclick="addTrainer()">Qo'shish</button>
        <p id="nt-msg" class="muted"></p>
      </div>

      <div class="between" style="margin-top:8px"><h2 style="margin:0">Trenerlar</h2><button class="ghost mini" onclick="loadTrainers()">Yangilash</button></div>
      <div id="trainerList"></div>
    </section>

    <!-- Audit log -->
    <section id="sec-audit" class="hidden">
      <div class="between"><h2 style="margin:0">Audit jurnali (kim nima qildi)</h2><button class="ghost mini" onclick="loadAudit()">Yangilash</button></div>
      <div id="auditList"></div>
    </section>
    </main>
  </div>

<script>
  const API = "https://orhhiqdvukshlvtqorgp.functions.supabase.co/admin-verify";
  let TOKEN = "";
  let staffCache = [];
  const expandedStaff = new Set();
  const $ = (id) => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const btn = (text, cls, on) => { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = on; return b; };
  const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  // Non-blocking toast (D1). type: "err" (default) | "ok". Auto-dismisses.
  function toast(msg, type) {
    const box = $("toast"); if (!box) return;
    const t = el("div", "toast " + (type === "ok" ? "ok" : "err"), String(msg == null ? "" : msg));
    box.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 200); }, 2600);
  }
  // Skeleton loader (D1): shimmer rows in a card while a list loads.
  function skeleton(box, rows) {
    box.innerHTML = "";
    const c = el("div", "card");
    for (let i = 0; i < (rows || 4); i++) {
      const s = el("div", "skel skel-row");
      s.style.width = (55 + Math.floor(Math.random() * 40)) + "%";
      c.appendChild(s);
    }
    box.appendChild(c);
  }

  async function api(action, extra) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(Object.assign({ action, token: TOKEN }, extra || {})),
    });
    let data = {}; try { data = await res.json(); } catch (e) {}
    // Session expired mid-use → drop back to login (avoid recursing via logout()).
    if (res.status === 401 && TOKEN && action !== "session") {
      TOKEN = ""; try { localStorage.removeItem("na_token"); } catch (e) {}
      $("dash").classList.add("hidden"); $("login").classList.remove("hidden");
      $("loginMsg").textContent = "Sessiya tugadi — qayta kiring.";
    }
    return { status: res.status, data };
  }
  // kun.oy.yil — date-only "2026-10-03" → "03.10.2026"; datetime keeps HH:MM.
  function fmt(dt) {
    if (!dt) return "-";
    const s = String(dt);
    const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(s);
    const d = new Date(dt); if (isNaN(d)) return s;
    const p = (n) => String(n).padStart(2, "0");
    const date = dateOnly
      ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4)
      : p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear();

  // Minimal CSS bar chart. values[], labels[], hi = highlight index (-1 none), fmt for tooltip.
  function renderBars(box, values, labels, hi, fmt) {
    box.innerHTML = "";
    const max = Math.max(1, ...values);
    const bars = el("div", "bars");
    values.forEach((v, i) => {
      const b = el("div", "bar" + (i === hi ? " hi" : "") + (v <= 0 ? " dim" : ""));
      b.style.height = Math.max(2, Math.round((v / max) * 100)) + "%";
      b.title = (labels[i] != null ? labels[i] + ": " : "") + (fmt ? fmt(v) : v);
      bars.appendChild(b);
    });
    box.appendChild(bars);
    if (values.length) {
      const lab = el("div", "barlabels");
      lab.appendChild(el("span", null, String(labels[0])));
      lab.appendChild(el("span", null, String(labels[Math.floor(values.length / 2)])));
      lab.appendChild(el("span", null, String(labels[values.length - 1])));
      box.appendChild(lab);
    }
  }

  // Inline actions inside a member's accordion: extend · freeze/unfreeze · note.
  function memberActions(userId, d, detail) {

      exBtn.disabled = true;
      const rr = await api("membership_extend", { user_id: userId, days });

      if (rr.data && rr.data.ok) { exInput.value = ""; await refreshMemberDetail(detail, userId); }

    if (!financeInit) {
      renderPayFilters();
      const today = new Date().toISOString().slice(0, 10);
      $("cashDate").value = today;
      $("revTo").value = today;
      $("revFrom").value = new Date(Date.now() - 29 * 86400000).toISOString().slice(0, 10);
      financeInit = true;
    }
    showFinance("journal");
  }
  function showFinance(sub) {
    ["journal", "cash", "revenue"].forEach((s) => {
      $("fsec-" + s).classList.toggle("hidden", s !== sub);
      $("ftab-" + s).className = s === sub ? "on" : "off";
    });
    if (sub === "journal") loadPayments(false);
    if (sub === "cash") loadCash();
    if (sub === "revenue") loadRevenue();
  }
  function renderPayFilters() {
    const pb = $("fProvFilters"); pb.innerHTML = "";
    PROV_FILTERS.forEach(([v, l]) => { const c = el("button", "chip" + (payState.provider === v ? " on" : ""), l); c.onclick = () => { payState.provider = v; renderPayFilters(); applyPayFilter(); }; pb.appendChild(c); });
    const sb = $("fStatFilters"); sb.innerHTML = "";
    PAY_STAT_FILTERS.forEach(([v, l]) => { const c = el("button", "chip" + (payState.status === v ? " on" : ""), l); c.onclick = () => { payState.status = v; renderPayFilters(); applyPayFilter(); }; sb.appendChild(c); });
  }
  function applyPayFilter() {
    payState.from = $("fFrom").value;
    payState.to = $("fTo").value;
    payState.q = $("fq").value.trim();
    loadPayments(false);
  }
  async function loadPayments(append) {
    if (payState.loading) return;
    payState.loading = true;
    if (!append) { payState.offset = 0; skeleton($("paymentsList"), 6); }
    const r = await api("payments_list", { provider: payState.provider, status: payState.status, from: payState.from, to: payState.to, q: payState.q, limit: PAGE, offset: payState.offset });
    payState.loading = false;
    const d = r.data || {};
    payState.total = d.total || 0;
    renderPaymentsList(d.payments || [], append);
    payState.offset += (d.payments || []).length;
    $("fSum").textContent = d.total ? ("Jami: " + d.total + " ta · " + uzs(d.sum_uzs || 0) + " so‘m") : "";
    $("fMore").classList.toggle("hidden", payState.offset >= payState.total);
  }
  function renderPaymentsList(payments, append) {
    const box = $("paymentsList");
    let card = append ? box.querySelector(".card") : null;
    if (!card) {
      box.innerHTML = "";
      if (payments.length === 0) { box.innerHTML = '<p class="muted">To‘lov topilmadi.</p>'; return; }
      card = el("div", "card"); box.appendChild(card);
    }
    payments.forEach((p) => card.appendChild(paymentItem(p)));
  }
  function paymentItem(p) {
    const it = el("div", "item");
    const top = el("div", "between");
    const left = el("div");
    left.innerHTML = '<div style="font-weight:700">' + uzs(p.amount_uzs) + ' so‘m <span class="muted">· ' + escapeHtml(PROV_LABEL[p.provider] || p.provider) + '</span></div>'
      + '<div class="muted">' + escapeHtml(p.member_name || "(ismsiz)") + ' · ' + fmt(p.paid_at || p.created_at) + (p.staff_name ? ' · ' + escapeHtml(p.staff_name) : '') + '</div>';
    const right = el("div"); right.style.flexShrink = "0";
    right.appendChild(el("span", "badge " + (PAY_BADGE[p.status] || "info"), PAY_LABEL[p.status] || p.status));
    top.appendChild(left); top.appendChild(right);
    it.appendChild(top);
    if (p.status === "paid") {
      const rb = btn("Qaytarish", "danger mini", () => refundPayment(p.id, p.amount_uzs));
      rb.style.marginTop = "8px";
      it.appendChild(rb);
    }
    return it;
  }
  async function refundPayment(id, amount) {
    if (!confirm("To‘lov (" + uzs(amount) + " so‘m) qaytarilsinmi? Bog‘langan a'zolik bekor qilinishi mumkin.")) return;
    if (!confirm("Aniqmi? Bu amalni orqaga qaytarib bo‘lmaydi.")) return;
    const r = await api("payment_refund", { payment_id: id });
    if (r.data && r.data.ok) { toast("Qaytarildi" + (r.data.membership_cancelled ? " · a'zolik bekor qilindi" : ""), "ok"); loadPayments(false); }
    else toast((r.data && r.data.error) || "Xato");
  }
  async function loadCash() {
    const date = $("cashDate").value || new Date().toISOString().slice(0, 10);
    const box = $("cashReport"); box.innerHTML = '<p class="muted">Yuklanmoqda…</p>';
    const r = await api("cash_report", { date });
    const d = r.data || {};
    box.innerHTML = "";
    const head = el("div", "card");
    head.innerHTML = '<div class="muted">Jami naqd</div><div class="big" style="margin:4px 0 0">' + uzs(d.total_uzs || 0) + ' so‘m</div><div class="muted">' + (d.total_count || 0) + ' ta to‘lov</div>';
    box.appendChild(head);
    if (!d.staff || !d.staff.length) { box.appendChild(el("p", "muted", "Bu kunda naqd yo‘q.")); return; }
    const t = el("div", "card");
    d.staff.forEach((s) => {
      const it = el("div", "item");
      it.innerHTML = '<div class="between"><span>' + escapeHtml(s.staff_name) + '</span><span style="font-weight:700">' + uzs(s.sum_uzs) + ' so‘m</span></div><div class="muted">' + s.count + ' ta</div>';
      t.appendChild(it);
    });
    box.appendChild(t);
  }
  async function loadRevenue() {
    const from = $("revFrom").value, to = $("revTo").value;
    const box = $("revReport"); box.innerHTML = '<p class="muted">Hisoblanmoqda…</p>';
    const extra = {}; if (from) extra.from = from; if (to) extra.to = to;
    const r = await api("revenue_report", extra);
    const d = r.data || {};
    box.innerHTML = "";
    const head = el("div", "card");
    head.innerHTML = '<div class="muted">' + fmt(d.from) + ' — ' + fmt(d.to) + '</div><div class="big" style="margin:6px 0 0">' + uzs(d.total_uzs || 0) + ' so‘m</div><div class="muted">' + (d.total_count || 0) + ' ta to‘lov</div>';
    box.appendChild(head);
    box.appendChild(groupCard("Provider bo‘yicha", d.by_provider, (k) => PROV_LABEL[k] || k));
    box.appendChild(groupCard("Tarif bo‘yicha", d.by_plan, null));
  }
  function groupCard(title, rows, labelFn) {
    const wrap = el("div");
    wrap.appendChild(el("h2", null, title));
    const c = el("div", "card");
    if (!rows || !rows.length) { c.innerHTML = '<p class="muted">Yo‘q</p>'; }
    else rows.forEach((row) => {
      const it = el("div", "item");
      const label = labelFn ? labelFn(row.label) : row.label;
      it.innerHTML = '<div class="between"><span>' + escapeHtml(label) + '</span><span style="font-weight:700">' + uzs(row.sum_uzs) + ' so‘m</span></div><div class="muted">' + row.count + ' ta</div>';
      c.appendChild(it);
    });
    wrap.appendChild(c);
    return wrap;
  }

  // ── Plans (tariffs) management ──────────────────────────────────────────
  const expandedPlans = new Set();
  async function loadPlansAdmin() {
    const box = $("plansList"); skeleton(box, 3);
    const r = await api("plan_list_all");
    const plans = (r.data && r.data.plans) || [];
    box.innerHTML = "";
    if (plans.length === 0) { box.innerHTML = '<p class="muted">Hali tarif yo\'q.</p>'; return; }
    plans.forEach((p) => box.appendChild(planItem(p)));
  }
  function planItem(p) {
    const c = el("div", "card");
    const top = el("div", "between");
    const left = el("div");
    left.innerHTML = '<div style="font-weight:700">' + escapeHtml(p.name_uz) + ' <span class="muted">· ' + p.duration_days + ' kun</span></div>'
      + '<div class="muted">App: ' + uzs(p.price_app_uzs) + ' · Zal: ' + uzs(p.price_gym_uzs) + ' so\'m · tartib ' + p.sort_order + '</div>';
    top.appendChild(left);
    top.appendChild(el("span", "badge " + (p.is_active ? "ok" : "bad"), p.is_active ? "FAOL" : "NOFAOL"));
    c.appendChild(top);

    // Inline edit form, revealed by "Tahrirlash" (kept open across reloads).
    const form = el("div"); form.style.marginTop = "10px";
    form.style.display = expandedPlans.has(p.id) ? "block" : "none";
    const mk = (labelTxt, val, type) => {
      form.appendChild(el("label", null, labelTxt));
      const inp = el("input"); if (type) { inp.type = type; inp.setAttribute("inputmode", "numeric"); }
      inp.value = val == null ? "" : String(val);
      form.appendChild(inp); return inp;
    };
    const iName = mk("Nom", p.name_uz);
    const iDays = mk("Davomiylik (kun)", p.duration_days, "number");
    const iApp = mk("App narxi (so'm)", p.price_app_uzs, "number");
    const iGym = mk("Zal narxi (so'm)", p.price_gym_uzs, "number");
    const iSort = mk("Tartib", p.sort_order, "number");
    const msg = el("p", "muted");
    const row = el("div", "row"); row.style.marginTop = "8px";
    const save = btn("Saqlash", "mini", async () => {
      const r = await api("plan_update", { plan_id: p.id, name_uz: iName.value, duration_days: iDays.value, price_app_uzs: iApp.value, price_gym_uzs: iGym.value, sort_order: iSort.value });
      if (r.data && r.data.ok) { msg.textContent = "Saqlandi ✓"; loadPlansAdmin(); }
      else { msg.textContent = (r.data && r.data.error) || "Xato"; }
    });
    const toggle = btn(p.is_active ? "Nofaol qilish" : "Faollashtirish", "ghost mini", async () => {
      const r = await api("plan_set_active", { plan_id: p.id, is_active: !p.is_active });
      if (r.data && r.data.ok) loadPlansAdmin(); else toast((r.data && r.data.error) || "Xato");
    });
    row.appendChild(save); row.appendChild(toggle);
    form.appendChild(row); form.appendChild(msg);

    const edit = btn(expandedPlans.has(p.id) ? "Yopish" : "Tahrirlash", "ghost mini", () => {
      if (expandedPlans.has(p.id)) { expandedPlans.delete(p.id); form.style.display = "none"; edit.textContent = "Tahrirlash"; }
      else { expandedPlans.add(p.id); form.style.display = "block"; edit.textContent = "Yopish"; }
    });
    edit.style.marginTop = "10px";
    c.appendChild(edit); c.appendChild(form);
    return c;
  }
  async function addPlan() {
    const r = await api("plan_create", {
      name_uz: $("np-name").value,
      duration_days: $("np-days").value,
      price_app_uzs: $("np-app").value,
      price_gym_uzs: $("np-gym").value,
      sort_order: $("np-sort").value || 0,
    });
    if (r.data && r.data.ok) {
      ["np-name", "np-days", "np-app", "np-gym", "np-sort"].forEach((id) => { $(id).value = ""; });
      $("np-msg").textContent = "Qo'shildi ✓"; loadPlansAdmin();
    } else { $("np-msg").textContent = (r.data && r.data.error) || "Xato"; }
  }

  // ── Content: exercise library + videos ──────────────────────────────────
  const expandedEx = new Set();
  async function loadContent() {
    const box = $("exerciseList"); skeleton(box, 4);
    const r = await api("exercise_list");
    const list = (r.data && r.data.exercises) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Hali mashq yo\'q.</p>'; return; }
    list.forEach((e) => box.appendChild(exerciseItem(e)));
  }
  function exerciseItem(e) {
    const vids = e.exercise_videos || [];
    const c = el("div", "card");
    const top = el("div");
    const muscles = (e.target_muscles || []).join(", ");
    top.innerHTML = '<div style="font-weight:700">' + escapeHtml(e.title) + '</div>'
      + '<div class="muted">' + (muscles ? escapeHtml(muscles) + ' · ' : '') + e.default_sets + '×' + e.default_reps + ' · ' + vids.length + ' video</div>';
    c.appendChild(top);

    const form = el("div"); form.style.marginTop = "10px";
    form.style.display = expandedEx.has(e.id) ? "block" : "none";
    const mk = (labelTxt, val, type) => {
      form.appendChild(el("label", null, labelTxt));
      const inp = el("input"); if (type) { inp.type = type; inp.setAttribute("inputmode", "numeric"); }
      inp.value = val == null ? "" : String(val); form.appendChild(inp); return inp;
    };
    const iTitle = mk("Nom", e.title);
    const iMus = mk("Mushaklar (vergul bilan)", (e.target_muscles || []).join(", "));
    const iSets = mk("Set", e.default_sets, "number");
    const iReps = mk("Takror", e.default_reps, "number");
    const iImg = mk("Rasm havolasi", e.image_url);
    const emsg = el("p", "muted");
    const saveRow = el("div", "row"); saveRow.style.marginTop = "8px";
    const save = btn("Saqlash", "mini", async () => {
      const r = await api("exercise_update", { exercise_id: e.id, title: iTitle.value, target_muscles: iMus.value, default_sets: iSets.value, default_reps: iReps.value, image_url: iImg.value });
      if (r.data && r.data.ok) { emsg.textContent = "Saqlandi ✓"; loadContent(); } else { emsg.textContent = (r.data && r.data.error) || "Xato"; }
    });
    const del = btn("O'chirish", "danger mini", async () => {
      if (!confirm("'" + e.title + "' o'chirilsinmi?")) return;
      const r = await api("exercise_delete", { exercise_id: e.id });
      if (r.data && r.data.ok) { expandedEx.delete(e.id); loadContent(); } else { toast((r.data && r.data.error) || "Xato"); }
    });
    saveRow.appendChild(save); saveRow.appendChild(del);
    form.appendChild(saveRow); form.appendChild(emsg);

    // Videos list + add
    form.appendChild(el("label", null, "Videolar"));
    if (vids.length) {
      vids.forEach((v) => {
        const it = el("div", "item");
        const b = el("div", "between");
        const link = el("div"); link.style.overflow = "hidden"; link.style.textOverflow = "ellipsis"; link.style.whiteSpace = "nowrap"; link.style.flex = "1";
        link.innerHTML = '<span class="muted">' + escapeHtml(v.url) + (v.duration_sec ? ' · ' + v.duration_sec + 's' : '') + '</span>';
        const rm = btn("O'chir", "danger mini", async () => {
          const r = await api("exercise_video_delete", { video_id: v.id });
          if (r.data && r.data.ok) loadContent(); else toast((r.data && r.data.error) || "Xato");
        });
        b.appendChild(link); b.appendChild(rm);
        it.appendChild(b); form.appendChild(it);
      });
    } else { form.appendChild(el("p", "muted", "Video yo'q")); }
    const vUrl = el("input"); vUrl.placeholder = "Video havolasi https://..."; vUrl.style.marginTop = "8px"; vUrl.setAttribute("autocomplete", "off");
    const vRow = el("div", "row");
    const vDur = el("input"); vDur.type = "number"; vDur.setAttribute("inputmode", "numeric"); vDur.placeholder = "sek (ixtiyoriy)";
    const vAdd = btn("Video qo'shish", "mini", async () => {
      const r = await api("exercise_video_add", { exercise_id: e.id, url: vUrl.value, duration_sec: vDur.value });
      if (r.data && r.data.ok) { vUrl.value = ""; vDur.value = ""; loadContent(); } else { toast((r.data && r.data.error) || "Xato"); }
    });
    vRow.appendChild(vDur); vRow.appendChild(vAdd);
    form.appendChild(vUrl); form.appendChild(vRow);

    const edit = btn(expandedEx.has(e.id) ? "Yopish" : "Tahrirlash", "ghost mini", () => {
      if (expandedEx.has(e.id)) { expandedEx.delete(e.id); form.style.display = "none"; edit.textContent = "Tahrirlash"; }
      else { expandedEx.add(e.id); form.style.display = "block"; edit.textContent = "Yopish"; }
    });
    edit.style.marginTop = "10px";
    c.appendChild(edit); c.appendChild(form);
    return c;
  }
  async function addExercise() {
    const r = await api("exercise_create", {
      title: $("ne-title").value,
      target_muscles: $("ne-muscles").value,
      default_sets: $("ne-sets").value || 3,
      default_reps: $("ne-reps").value || 10,
      image_url: $("ne-img").value,
    });
    if (r.data && r.data.ok) {
      ["ne-title", "ne-muscles", "ne-sets", "ne-reps", "ne-img"].forEach((id) => { $(id).value = ""; });
      $("ne-msg").textContent = "Qo'shildi ✓"; loadContent();
    } else { $("ne-msg").textContent = (r.data && r.data.error) || "Xato"; }
  }

  // ── Trainers ─────────────────────────────────────────────────────────────
  let trainersCache = null; // full list from trainer_list (incl. inactive)
  const expandedTrainers = new Set();
  async function fetchTrainers() {
    const r = await api("trainer_list");
    trainersCache = (r.data && r.data.trainers) || [];
    return trainersCache;
  }
  const activeTrainers = () => (trainersCache || []).filter((t) => t.is_active);
  async function loadTrainers() {
    const box = $("trainerList"); skeleton(box, 3);
    await fetchTrainers();
    box.innerHTML = "";
    if (!trainersCache.length) { box.innerHTML = '<p class="muted">Hali trener yo\'q.</p>'; return; }
    trainersCache.forEach((t) => box.appendChild(trainerItem(t)));
  }
  function trainerItem(t) {
    const c = el("div", "card");
    const top = el("div", "between");
    const left = el("div");
    left.innerHTML = '<div style="font-weight:700">' + escapeHtml(t.name) + (t.specialization ? ' <span class="muted">· ' + escapeHtml(t.specialization) + '</span>' : '') + '</div>'
      + '<div class="muted">' + t.member_count + ' a\'zo' + (t.bio ? ' · ' + escapeHtml(t.bio) : '') + '</div>';
    top.appendChild(left);
    top.appendChild(el("span", "badge " + (t.is_active ? "ok" : "bad"), t.is_active ? "FAOL" : "NOFAOL"));
    c.appendChild(top);

    const form = el("div"); form.style.marginTop = "10px"; form.style.display = expandedTrainers.has(t.id) ? "block" : "none";
    const mk = (labelTxt, val, ta) => {
      form.appendChild(el("label", null, labelTxt));
      const inp = el(ta ? "textarea" : "input"); if (ta) inp.rows = 2;
      inp.value = val == null ? "" : String(val); form.appendChild(inp); return inp;
    };
    const iName = mk("Ism", t.name);
    const iSpec = mk("Mutaxassislik", t.specialization);
    const iBio = mk("Bio", t.bio, true);
    const iPhoto = mk("Rasm havolasi", t.photo_url);
    const msg = el("p", "muted");
    const row = el("div", "row"); row.style.marginTop = "8px";
    const save = btn("Saqlash", "mini", async () => {
      const r = await api("trainer_update", { trainer_id: t.id, name: iName.value, specialization: iSpec.value, bio: iBio.value, photo_url: iPhoto.value });
      if (r.data && r.data.ok) { msg.textContent = "Saqlandi ✓"; loadTrainers(); } else { msg.textContent = (r.data && r.data.error) || "Xato"; }
    });
    const toggle = btn(t.is_active ? "Nofaol qilish" : "Faollashtirish", "ghost mini", async () => {
      const r = await api("trainer_set_active", { trainer_id: t.id, is_active: !t.is_active });
      if (r.data && r.data.ok) loadTrainers(); else toast((r.data && r.data.error) || "Xato");
    });
    row.appendChild(save); row.appendChild(toggle);
    form.appendChild(row); form.appendChild(msg);

    const edit = btn(expandedTrainers.has(t.id) ? "Yopish" : "Tahrirlash", "ghost mini", () => {
      if (expandedTrainers.has(t.id)) { expandedTrainers.delete(t.id); form.style.display = "none"; edit.textContent = "Tahrirlash"; }
      else { expandedTrainers.add(t.id); form.style.display = "block"; edit.textContent = "Yopish"; }
    });
    edit.style.marginTop = "10px";
    c.appendChild(edit); c.appendChild(form);
    return c;
  }
  async function addTrainer() {
    const r = await api("trainer_create", { name: $("nt-name").value, specialization: $("nt-spec").value, bio: $("nt-bio").value, photo_url: $("nt-photo").value });
    if (r.data && r.data.ok) {
      ["nt-name", "nt-spec", "nt-bio", "nt-photo"].forEach((id) => { $(id).value = ""; });
      $("nt-msg").textContent = "Qo'shildi ✓"; trainersCache = null; loadTrainers();
    } else { $("nt-msg").textContent = (r.data && r.data.error) || "Xato"; }
  }

  // Restore the session token remembered on this device (verify it's still valid).
  (function () {
    let saved = ""; try { saved = localStorage.getItem("na_token") || ""; } catch (e) {}
    if (!saved) return;
    TOKEN = saved;
    api("session").then((r) => {
      if (r.status === 200 && (r.data.role === "admin" || r.data.role === "owner")) {
        $("login").classList.add("hidden"); $("dash").classList.remove("hidden"); show("dash");
      } else { TOKEN = ""; try { localStorage.removeItem("na_token"); } catch (e) {} }
    });
  })();
</script>
</body>
</html>
