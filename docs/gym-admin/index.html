<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nerofit — Admin</title>
<style>
  :root { --bg:#000; --card:#141414; --line:#262626; --hi:#fff; --lo:#8a8a8a; --acc:#D4E924; --ok:#D4E924; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--hi); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:640px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:var(--lo); font-weight:700; }
  h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--lo); margin:22px 0 8px; }
  input, select, button { font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--hi); padding:11px 13px; width:100%; }
  button { background:var(--acc); color:#000; border:none; font-weight:700; letter-spacing:.03em; cursor:pointer; }
  button.ghost { background:transparent; color:var(--hi); border:1px solid var(--line); }
  button.mini { width:auto; padding:7px 11px; font-size:13px; }
  button.danger { background:var(--bad); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:10px; border:1px solid var(--line); }
  .between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .badge.ok { background:var(--ok); color:#000; } .badge.bad { background:var(--bad); color:#000; }
  .badge.warn { background:#333; color:#fff; }
  .muted { color:var(--lo); font-size:13px; }
  .big { font-size:22px; font-weight:800; margin:4px 0; }
  .nav { display:flex; gap:8px; margin-top:14px; }
  .nav button { flex:1; }
  .nav button.on { background:var(--acc); color:#000; } .nav button.off { background:transparent; color:var(--hi); border:1px solid var(--line); }
  .hidden { display:none; }
  .item { padding:9px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  .detail { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  label { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lo); display:block; margin:12px 0 5px; }
</style>
</head>
<body>
  <h1>Nerofit · Admin</h1>

  <!-- Login -->
  <div id="login">
    <label>Admin parol</label>
    <div class="row">
      <input id="pwd" type="password" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button style="flex:0 0 110px" onclick="login()">Kirish</button>
    </div>
    <p id="loginMsg" class="muted"></p>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <div class="nav">
      <button id="tab-staff" class="on" onclick="show('staff')">Xodimlar</button>
      <button id="tab-members" class="off" onclick="show('members')">A'zolar</button>
      <button id="tab-audit" class="off" onclick="show('audit')">Audit</button>
    </div>

    <!-- Staff -->
    <section id="sec-staff">
      <h2>Yangi xodim</h2>
      <div class="card">
        <label>Ism</label>
        <input id="ns-name" placeholder="Xodim ismi" autocomplete="off" />
        <label>Parol (noyob)</label>
        <input id="ns-pwd" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button style="margin-top:10px" onclick="addStaff()">Qo'shish</button>
        <p id="ns-msg" class="muted"></p>
      </div>

      <h2>Xodimlar ro'yxati</h2>
      <div id="staffList"></div>

      <h2>Admin paroli (o'zingizniki)</h2>
      <div class="card">
        <label>Hozirgi parol</label>
        <input id="ap-cur" type="password" placeholder="hozirgi" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <label>Yangi parol</label>
        <input id="ap-new" type="password" placeholder="yangi" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button style="margin-top:10px" onclick="changeAdminPw()">Saqlash</button>
        <p id="ap-msg" class="muted"></p>
      </div>

      <button class="ghost" style="margin-top:24px" onclick="logout()">Chiqish</button>
    </section>

    <!-- Members + activity (merged) -->
    <section id="sec-members" class="hidden">
      <h2>A'zoni qidirish (ism bo'yicha)</h2>
      <div class="row">
        <input id="mq" placeholder="Ism..." autocomplete="off" onkeydown="if(event.key==='Enter')searchMembers()" />
        <button style="flex:0 0 110px" onclick="searchMembers()">Qidirish</button>
      </div>
      <div id="memberResults"></div>

      <div class="between" style="margin-top:20px">
        <h2 style="margin:0">So'nggi kelishlar</h2>
        <button class="ghost mini" onclick="loadFeed()">Yangilash</button>
      </div>
      <div id="feed"></div>
    </section>

    <!-- Audit log -->
    <section id="sec-audit" class="hidden">
      <div class="between"><h2 style="margin:0">Audit jurnali (kim nima qildi)</h2><button class="ghost mini" onclick="loadAudit()">Yangilash</button></div>
      <div id="auditList"></div>
    </section>
  </div>

<script>
  const API = "https://orhhiqdvukshlvtqorgp.functions.supabase.co/admin-verify";
  let TOKEN = "";
  let staffCache = [];
  const expandedStaff = new Set();
  const $ = (id) => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const btn = (text, cls, on) => { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = on; return b; };
  const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  async function api(action, extra) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(Object.assign({ action, token: TOKEN }, extra || {})),
    });
    let data = {}; try { data = await res.json(); } catch (e) {}
    // Session expired mid-use → drop back to login (avoid recursing via logout()).
    if (res.status === 401 && TOKEN && action !== "session") {
      TOKEN = ""; try { localStorage.removeItem("na_token"); } catch (e) {}
      $("dash").classList.add("hidden"); $("login").classList.remove("hidden");
      $("loginMsg").textContent = "Sessiya tugadi — qayta kiring.";
    }
    return { status: res.status, data };
  }
  // kun.oy.yil — date-only "2026-10-03" → "03.10.2026"; datetime keeps HH:MM.
  function fmt(dt) {
    if (!dt) return "-";
    const s = String(dt);
    const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(s);
    const d = new Date(dt); if (isNaN(d)) return s;
    const p = (n) => String(n).padStart(2, "0");
    const date = dateOnly
      ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4)
      : p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear();
    return dateOnly ? date : date + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  const uzs = (n) => (n || 0).toLocaleString("ru-RU");

  // ── Auth ──────────────────────────────────────────────────────────────
  async function login() {
    const pwd = $("pwd").value;
    $("loginMsg").textContent = "Tekshirilmoqda…";
    const res = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "login", password: pwd }) });
    let d = {}; try { d = await res.json(); } catch (e) {}
    if (res.status !== 200 || !d.token) { $("loginMsg").textContent = (d && d.error) || "Parol noto'g'ri"; return; }
    if (d.role !== "admin" && d.role !== "owner") { $("loginMsg").textContent = "Bu parol admin emas (xodim). Admin parol kerak."; return; }
    TOKEN = d.token; try { localStorage.setItem("na_token", TOKEN); } catch (e) {}
    $("loginMsg").textContent = "";
    $("login").classList.add("hidden");
    $("dash").classList.remove("hidden");
    loadStaff();
  }
  function logout() {
    try { api("logout"); } catch (e) {}
    TOKEN = ""; try { localStorage.removeItem("na_token"); } catch (e) {}
    $("dash").classList.add("hidden"); $("login").classList.remove("hidden"); $("pwd").value = "";
  }
  function show(tab) {
    ["staff", "members", "audit"].forEach((t) => {
      $("sec-" + t).classList.toggle("hidden", t !== tab);
      $("tab-" + t).className = t === tab ? "on" : "off";
    });
    if (tab === "members") loadFeed();
    if (tab === "audit") loadAudit();
  }
  async function changeAdminPw() {
    const nw = $("ap-new").value.trim();
    if (!nw) { $("ap-msg").textContent = "Yangi parol kerak"; return; }
    const r = await api("admin_set_password", { new_password: nw });
    if (r.data && r.data.ok) {
      $("ap-cur").value = ""; $("ap-new").value = ""; $("ap-msg").textContent = "Parol yangilandi ✓";
    } else {
      $("ap-msg").textContent = (r.data && r.data.error) || "Xato";
    }
  }
  async function loadAudit() {
    const box = $("auditList"); box.innerHTML = '<p class="muted">Yuklanmoqda…</p>';
    const r = await api("audit_list");
    const list = (r.data && r.data.audit) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Hali yozuv yo’q.</p>'; return; }
    const c = el("div", "card");
    list.forEach((a) => {
      const it = el("div", "item");
      const ip = a.meta && a.meta.ip ? " · " + a.meta.ip : "";
      it.innerHTML = '<div class="between"><div style="font-weight:700">' + escapeHtml(a.action) + '</div><span class="muted">' + fmt(a.created_at) + '</span></div>'
        + '<div class="muted">' + escapeHtml(a.actor_name || "-") + ' (' + escapeHtml(a.actor_role || "-") + ')' + (a.target ? " → " + escapeHtml(String(a.target)) : "") + ip + '</div>';
      c.appendChild(it);
    });
    box.appendChild(c);
  }

  // ── Staff management ────────────────────────────────────────────────────
  async function loadStaff() {
    const r = await api("staff_list");
    staffCache = (r.data && r.data.staff) || [];
    const box = $("staffList"); box.innerHTML = "";
    if (staffCache.length === 0) { box.innerHTML = '<p class="muted">Hali xodim yo’q.</p>'; return; }
    staffCache.forEach((s) => {
      const c = el("div", "card");
      const top = el("div", "between");
      const left = el("div");
      left.innerHTML = '<div style="font-weight:700">' + escapeHtml(s.name) + ' <span class="muted">· ' + s.role + '</span></div>';
      top.appendChild(left);
      top.appendChild(el("span", "badge " + (s.is_active ? "ok" : "bad"), s.is_active ? "FAOL" : "O‘CHIQ"));
      c.appendChild(top);

      // Actions revealed by "Tahrirlash" — kept open across reloads via expandedStaff.
      const acts = el("div"); acts.style.marginTop = "10px";
      acts.style.display = expandedStaff.has(s.id) ? "block" : "none";

      const pwWrap = el("div"); pwWrap.style.display = "none"; pwWrap.style.marginTop = "8px";
      const pwInput = el("input"); pwInput.placeholder = "yangi parol"; pwInput.setAttribute("autocomplete", "off");
      pwInput.setAttribute("autocapitalize", "none"); pwInput.setAttribute("autocorrect", "off"); pwInput.setAttribute("spellcheck", "false");
      const pwSave = btn("Saqlash", "", async () => {
        const v = pwInput.value.trim(); if (!v) return;
        const rr = await api("staff_set_password", { staff_id: s.id, new_password: v });
        if (rr.data && rr.data.ok) { pwInput.value = ""; pwWrap.style.display = "none"; alert("Parol o‘zgartirildi"); }
        else { alert((rr.data && rr.data.error) || "Xato"); }
      });
      pwSave.style.marginTop = "8px";
      pwWrap.appendChild(pwInput); pwWrap.appendChild(pwSave);

      const rowA = el("div", "row");
      rowA.appendChild(btn("Parol o‘zgartirish", "ghost mini", () => { pwWrap.style.display = pwWrap.style.display === "none" ? "block" : "none"; }));
      rowA.appendChild(btn(s.is_active ? "O‘chirish" : "Yoqish", "ghost mini", () => toggleStaff(s)));
      rowA.appendChild(btn("Del", "danger mini", () => delStaff(s)));
      acts.appendChild(rowA); acts.appendChild(pwWrap);

      const edit = btn(expandedStaff.has(s.id) ? "Yopish" : "Tahrirlash", "ghost mini", () => {
        if (expandedStaff.has(s.id)) { expandedStaff.delete(s.id); acts.style.display = "none"; edit.textContent = "Tahrirlash"; }
        else { expandedStaff.add(s.id); acts.style.display = "block"; edit.textContent = "Yopish"; }
      });
      edit.style.marginTop = "10px";
      c.appendChild(edit); c.appendChild(acts);
      box.appendChild(c);
    });
  }
  async function addStaff() {
    const name = $("ns-name").value.trim(), pw = $("ns-pwd").value.trim();
    if (!name || !pw) { $("ns-msg").textContent = "Ism va parol kerak"; return; }
    const r = await api("staff_add", { name, new_password: pw });
    if (r.data && r.data.ok) { $("ns-name").value = ""; $("ns-pwd").value = ""; $("ns-msg").textContent = "Qo‘shildi ✓"; loadStaff(); }
    else { $("ns-msg").textContent = (r.data && r.data.error) || "Xato"; }
  }
  async function toggleStaff(s) { await api("staff_set_active", { staff_id: s.id, is_active: !s.is_active }); await loadStaff(); }
  async function delStaff(s) {
    if (!confirm("'" + s.name + "' o‘chirilsinmi?")) return;
    expandedStaff.delete(s.id);
    await api("staff_delete", { staff_id: s.id }); await loadStaff();
  }

  // ── Members + activity (inline accordion) ───────────────────────────────
  function memberDetailHtml(d) {
    if (!d || !d.found) return '<p class="muted">Ma’lumot yo’q.</p>';
    const frozen = !!(d.membership && d.membership.status === "frozen");
    const badgeCls = d.active ? "ok" : (frozen ? "warn" : "bad");
    const badgeTxt = d.active ? "FAOL" : (frozen ? "MUZLATILGAN" : "FAOL EMAS");
    let h = '<span class="badge ' + badgeCls + '">' + badgeTxt + '</span>';
    h += '<div class="big">' + escapeHtml(d.name || "(ismsiz)") + '</div>';
    if (d.membership) h += '<div class="muted">' + escapeHtml(d.membership.plan_name || "") + ' · tugaydi: ' + fmt(d.membership.end_date) + (frozen ? ' · muzlatilgan' : '') + '</div>';
    h += '<h2>To‘lovlar (qachon qabul bo‘ldi)</h2>';
    h += (d.payments && d.payments.length) ? d.payments.map((p) =>
      '<div class="item"><div class="between"><span>' + uzs(p.amount_uzs) + ' so‘m · ' + p.provider + '</span><span class="muted">' + p.status + '</span></div>' +
      '<div class="muted">' + fmt(p.paid_at || p.created_at) + (p.staff_name ? ' · ' + escapeHtml(p.staff_name) : '') + '</div></div>'
    ).join("") : '<p class="muted">Yo’q</p>';
    h += '<h2>Kelishlar (qachon keldi)</h2>';
    h += (d.checkins && d.checkins.length) ? d.checkins.map((c) =>
      '<div class="item"><div class="between"><span>' + fmt(c.checked_at) + '</span><span class="badge ' + (c.was_active ? "ok" : "bad") + '">' + (c.was_active ? "faol" : "emas") + '</span></div>' +
      '<div class="muted">' + escapeHtml(c.staff_name || "-") + '</div></div>'
    ).join("") : '<p class="muted">Hali kelmagan</p>';
    return h;
  }
  // A "Ko'rish ▾" button + an inline detail div that opens IN PLACE.
  function makeViewToggle(userId) {
    const detail = el("div", "detail"); detail.style.display = "none";
    let open = false;
    const b = btn("Ko‘rish ▾", "ghost mini", async () => {
      open = !open;
      if (open) { detail.style.display = "block"; b.textContent = "Yopish ▴"; detail.innerHTML = '<p class="muted">Yuklanmoqda…</p>'; const r = await api("member_detail", { user_id: userId }); detail.innerHTML = memberDetailHtml(r.data); }
      else { detail.style.display = "none"; detail.innerHTML = ""; b.textContent = "Ko‘rish ▾"; }
    });
    return { button: b, detail };
  }
  async function searchMembers() {
    const q = $("mq").value.trim(); if (!q) return;
    const box = $("memberResults"); box.innerHTML = '<p class="muted">Qidirilmoqda…</p>';
    const r = await api("members_search", { q });
    const list = (r.data && r.data.members) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Topilmadi.</p>'; return; }
    const c = el("div", "card");
    list.forEach((m) => {
      const it = el("div", "item");
      const b = el("div", "between");
      b.appendChild(el("div", null, m.name || "(ismsiz) " + m.id.slice(0, 8)));
      const vt = makeViewToggle(m.id);
      b.appendChild(vt.button);
      it.appendChild(b); it.appendChild(vt.detail);
      c.appendChild(it);
    });
    box.appendChild(c);
  }
  async function loadFeed() {
    const box = $("feed"); box.innerHTML = '<p class="muted">Yuklanmoqda…</p>';
    const r = await api("checkins_recent");
    const list = (r.data && r.data.checkins) || [];
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = '<p class="muted">Hali kelishlar yo’q.</p>'; return; }
    const c = el("div", "card");
    list.forEach((k) => {
      const it = el("div", "item");
      const b = el("div", "between");
      const info = el("div");
      info.innerHTML = '<div>' + escapeHtml(k.member_name || "(ismsiz)") + '</div><div class="muted">' + fmt(k.checked_at) + ' · ' + escapeHtml(k.staff_name || "-") + '</div>';
      const right = el("div"); right.style.display = "flex"; right.style.gap = "8px"; right.style.alignItems = "center";
      const vt = makeViewToggle(k.user_id);
      right.appendChild(vt.button);
      right.appendChild(el("span", "badge " + (k.was_active ? "ok" : "bad"), k.was_active ? "FAOL" : "EMAS"));
      b.appendChild(info); b.appendChild(right);
      it.appendChild(b); it.appendChild(vt.detail);
      c.appendChild(it);
    });
    box.appendChild(c);
  }

  // Restore the session token remembered on this device (verify it's still valid).
  (function () {
    let saved = ""; try { saved = localStorage.getItem("na_token") || ""; } catch (e) {}
    if (!saved) return;
    TOKEN = saved;
    api("session").then((r) => {
      if (r.status === 200 && (r.data.role === "admin" || r.data.role === "owner")) {
        $("login").classList.add("hidden"); $("dash").classList.remove("hidden"); loadStaff();
      } else { TOKEN = ""; try { localStorage.removeItem("na_token"); } catch (e) {} }
    });
  })();
</script>
</body>
</html>
