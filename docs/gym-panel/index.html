<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nerofit — A'zolik tekshirish</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#000; --card:#141414; --line:#262626; --hi:#fff; --lo:#8a8a8a; --acc:#D4E924; --ok:#D4E924; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--hi); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:520px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:var(--lo); font-weight:700; }
  input, select, button { font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--hi); padding:12px 14px; width:100%; }
  button { background:var(--acc); color:#000; border:none; font-weight:700; letter-spacing:.04em; cursor:pointer; }
  .row { display:flex; gap:8px; margin-top:10px; }
  .row > * { flex:1; }
  #reader { margin-top:14px; border-radius:12px; overflow:hidden; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-top:16px; border:1px solid var(--line); }
  .badge { display:inline-block; padding:6px 12px; border-radius:999px; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .badge.ok { background:var(--ok); color:#000; } .badge.bad { background:var(--bad); color:#000; }
  .badge.warn { background:#333; color:#fff; }
  .muted { color:var(--lo); font-size:14px; } .big { font-size:26px; font-weight:800; margin:8px 0; }
  label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--lo); display:block; margin:14px 0 6px; }
</style>
</head>
<body>
  <h1>Nerofit · A'zolik</h1>
  <label>Panel paroli</label>
  <input id="pwd" type="password" placeholder="parol" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
  <div class="row">
    <button id="scanBtn" onclick="toggleScan()">Skaner</button>
  </div>
  <div id="reader"></div>
  <label>Yoki foydalanuvchi ID</label>
  <div class="row">
    <input id="uid" placeholder="user_id" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
    <button style="flex:0 0 120px" onclick="handleCode(document.getElementById('uid').value)">Tekshirish</button>
  </div>
  <div id="out"></div>

<script>
  var API = "https://orhhiqdvukshlvtqorgp.functions.supabase.co/admin-verify";
  var scanner = null, scanning = false, plans = null;

  // Remember the panel password on this device (gym desk / staff phone).
  var pwdEl = document.getElementById('pwd');
  try { pwdEl.value = localStorage.getItem('np_pwd') || ''; } catch (e) {}
  pwdEl.addEventListener('input', function () {
    try { localStorage.setItem('np_pwd', pwdEl.value); } catch (e) {}
  });
  function el(t,c,txt){ var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; }
  function out(){ return document.getElementById('out'); }
  // "2026-10-03" → "03.10.2026" (date part only).
  function fmt(s){ if(!s) return '-'; var p=String(s).slice(0,10).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : String(s); }

  async function api(action, extra){
    var b = Object.assign({ action:action, password: document.getElementById('pwd').value }, extra||{});
    var res = await fetch(API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b) });
    var data = {}; try { data = await res.json(); } catch(e){}
    return { status: res.status, data: data };
  }

  function toggleScan(){
    if(scanning){ stopScan(); return; }
    scanner = new Html5Qrcode('reader');
    scanner.start({ facingMode:'environment' }, { fps:10, qrbox:240 }, function(text){
      stopScan(); document.getElementById('uid').value = text; handleCode(text);
    }).then(function(){ scanning = true; document.getElementById('scanBtn').textContent = 'To‘xtatish'; })
      .catch(function(){ alert('Kamera ochilmadi'); });
  }
  function stopScan(){ if(scanner && scanning){ scanner.stop().catch(function(){}); } scanning=false; document.getElementById('scanBtn').textContent='Skaner'; }

  async function verify(userId){
    userId = (userId||'').trim(); if(!userId) return;
    out().innerHTML=''; out().appendChild(el('p','muted','Tekshirilmoqda…'));
    var r = await api('verify', { user_id:userId });
    if(r.status === 401){ out().innerHTML=''; out().appendChild(el('p','muted','Parol noto‘g‘ri')); return; }
    render(r.data, userId);
  }

  function render(d, userId){
    out().innerHTML='';
    var c = el('div','card');
    if(!d.found){ c.appendChild(el('p','muted','Foydalanuvchi topilmadi')); out().appendChild(c); return; }
    var badgeCls = d.active ? 'ok' : (d.frozen ? 'warn' : 'bad');
    var badgeTxt = d.active ? 'FAOL' : (d.frozen ? 'MUZLATILGAN' : 'FAOL EMAS');
    c.appendChild(el('span','badge '+badgeCls, badgeTxt));
    if(d.name) c.appendChild(el('div','big', d.name));
    if(d.active){
      c.appendChild(el('div',null,(d.plan_name||'')));
      c.appendChild(el('div','muted','Tugaydi: '+fmt(d.end_date)+' · '+d.days_left+' kun qoldi'));
      buildFreeze(c, userId);
    } else if(d.frozen){
      c.appendChild(el('div',null,(d.plan_name||'')));
      c.appendChild(el('div','muted','Muzlatilgan · '+d.days_left+' kun saqlangan'));
      buildUnfreeze(c, userId);
    } else {
      c.appendChild(el('div','muted','Holat: '+d.status));
      buildActivate(c, userId);
    }
    out().appendChild(c);
  }

  // Freeze an active membership (staff): pause the clock, preserve remaining days.
  function buildFreeze(c, userId){
    var btn = el('button',null,'Muzlatish');
    btn.style.marginTop='12px'; btn.style.background='#333'; btn.style.color='#fff';
    btn.onclick = async function(){
      if(!confirm('A‘zolikni muzlatasizmi? Qolgan kunlar saqlanadi.')) return;
      btn.disabled=true; btn.textContent='...';
      var r = await api('freeze', { user_id:userId });
      if(r.data && r.data.ok){ verify(userId); } else { alert((r.data && r.data.error) || 'Xato'); btn.disabled=false; btn.textContent='Muzlatish'; }
    };
    c.appendChild(btn);
  }

  // Unfreeze (staff): resume the clock and push end_date out by the frozen span.
  function buildUnfreeze(c, userId){
    var btn = el('button',null,'Muzlatishdan chiqarish');
    btn.style.marginTop='12px';
    btn.onclick = async function(){ btn.disabled=true; btn.textContent='...';
      var r = await api('unfreeze', { user_id:userId });
      if(r.data && r.data.ok){ verify(userId); } else { alert((r.data && r.data.error) || 'Xato'); btn.disabled=false; btn.textContent='Muzlatishdan chiqarish'; }
    };
    c.appendChild(btn);
  }

  async function buildActivate(c, userId){
    c.appendChild(el('label',null,'Qo‘lda faollashtirish (naqd to‘lov)'));
    var sel = el('select'); sel.id='plan';
    if(!plans){ var p = await api('plans'); plans = (p.data && p.data.plans) || []; }
    plans.forEach(function(pl){ var o=el('option',null, pl.name_uz+' — '+pl.price_app_uzs.toLocaleString('ru-RU')+' so‘m'); o.value=pl.id; sel.appendChild(o); });
    c.appendChild(sel);
    var btn = el('button',null,'Faollashtirish'); btn.style.marginTop='10px';
    btn.onclick = async function(){ btn.disabled=true; btn.textContent='...';
      var r = await api('activate', { user_id:userId, plan_id: sel.value });
      if(r.data && r.data.ok){ verify(userId); } else { alert((r.data && r.data.error) || 'Xato'); btn.disabled=false; btn.textContent='Faollashtirish'; }
    };
    c.appendChild(btn);
  }

  // Route a scanned/entered code: "order:<id>" → cash order, otherwise a member.
  function handleCode(text){
    text = (text||'').trim();
    if(text.indexOf('order:') === 0){ verifyOrder(text); } else { verify(text); }
  }

  async function verifyOrder(raw){
    var orderId = (raw||'').replace(/^order:/,'').trim(); if(!orderId) return;
    out().innerHTML=''; out().appendChild(el('p','muted','Buyurtma tekshirilmoqda…'));
    var r = await api('order_detail', { order_id: orderId });
    if(r.status === 401){ out().innerHTML=''; out().appendChild(el('p','muted','Parol noto‘g‘ri')); return; }
    renderOrder(r.data, orderId);
  }

  function renderOrder(d, orderId){
    out().innerHTML='';
    var c = el('div','card'); c.style.padding='12px 14px';
    if(!d.found){ c.appendChild(el('p','muted','Buyurtma topilmadi')); out().appendChild(c); return; }
    var paid = d.status === 'paid';
    c.appendChild(el('span','badge '+(paid?'ok':'bad'), paid?'TO‘LANGAN':'NAQD KUTILMOQDA'));
    if(d.user_name){ var nm0=el('div',null,d.user_name); nm0.style.fontWeight='700'; nm0.style.marginTop='8px'; c.appendChild(nm0); }
    c.appendChild(el('div','muted',(d.plan_name||'')));
    c.appendChild(el('div','muted',(d.amount_uzs||0).toLocaleString('ru-RU')+' so‘m'));
    if(paid){
      c.appendChild(el('div','muted','Allaqachon faollashtirilgan'));
    } else {
      var btn = el('button',null,'Naqd olindi — faollashtirish');
      btn.style.marginTop='12px'; btn.style.width='auto'; btn.style.padding='9px 18px'; btn.style.fontSize='14px';
      btn.onclick = async function(){ btn.disabled=true; btn.textContent='...';
        var r = await api('order_activate', { order_id: orderId });
        if(r.data && r.data.ok){
          out().innerHTML='';
          var cc = el('div','card'); cc.style.padding='12px 14px';
          var hd = el('div'); hd.style.display='flex'; hd.style.alignItems='center'; hd.style.gap='10px';
          hd.appendChild(el('span','badge ok','FAOLLASHTIRILDI'));
          if(d.user_name){ var nm=el('div',null,d.user_name); nm.style.fontWeight='700'; hd.appendChild(nm); }
          cc.appendChild(hd);
          cc.appendChild(el('div','muted','Tugaydi: '+fmt(r.data.end_date)+' · '+r.data.days_left+' kun'));
          out().appendChild(cc);
        } else { alert((r.data && r.data.error) || 'Xato'); btn.disabled=false; btn.textContent='Naqd olindi — faollashtirish'; }
      };
      c.appendChild(btn);
    }
    out().appendChild(c);
  }
</script>
</body>
</html>
